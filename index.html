<!doctype html>
<html lang="es-AR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>honorapp</title>
    <meta name="theme-color" content="#557F69" />
    <meta name="description" content="Control de cobros para profesionales con pacientes: sesiones, pagos, saldos y reportes." />
    <link rel="icon" type="image/svg+xml" href="/honorapp-favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="honorapp" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Instrument+Serif&display=swap"
      rel="stylesheet"
    />
    <script>
      // Aplica el tema antes de pintar para evitar el parpadeo.
      try {
        var t = localStorage.getItem('tema')
        if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        document.documentElement.dataset.theme = t
        // Tamaño de letra elegido en Ajustes (todo escala con él).
        var l = { 1: '100%', 2: '112.5%', 3: '125%', 4: '137.5%', 5: '150%' }[localStorage.getItem('letra')]
        if (l) {
          document.documentElement.style.fontSize = l
          document.documentElement.dataset.letra = localStorage.getItem('letra')
        }
        // Colores para daltonismo (Ajustes).
        if (localStorage.getItem('colores') === 'daltonismo') document.documentElement.dataset.colores = 'daltonismo'
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
